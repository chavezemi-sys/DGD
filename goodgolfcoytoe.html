<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f3322">
<title>Good Golf – Live Tournament Scorecard</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: { extend: { colors: {
      forest: { 50:'#f1f7f3',100:'#ddeee3',200:'#bcdcc8',300:'#8fc2a4',400:'#5ba27a',500:'#388a5c',600:'#276f49',700:'#1d593b',800:'#174631',900:'#0f3322' },
      cream: '#f6f6f2', gold: '#c9a227'
    } } }
  };
</script>
<style>
  html { -webkit-text-size-adjust: 100%; }
  body { margin:0; background:#eef1ea; color:#1e293b; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
  button { touch-action: manipulation; cursor: pointer; }
  button:active { transform: scale(.96); }
  input { font-size: 16px; } /* prevents iOS zoom on focus */
  .no-sb { scrollbar-width: none; } .no-sb::-webkit-scrollbar { display: none; }
  .tbl-wrap::-webkit-scrollbar { height: 8px; } .tbl-wrap::-webkit-scrollbar-thumb { background:#276f49; border-radius:4px; }
  .tbl-wrap::-webkit-scrollbar-track { background:#e5e7eb; }
  table.sc { border-collapse: separate; border-spacing: 0; width: max-content; min-width: 100%; }
  table.sc th, table.sc td { text-align:center; padding: 6px 4px; min-width: 38px; border-bottom:1px solid #e5e7eb; border-right:1px solid #f1f5f9; font-variant-numeric: tabular-nums; }
  table.sc .sticky-n { position: sticky; left: 0; z-index: 5; text-align:left; min-width: 104px; max-width: 120px; padding-left: 10px; background:#fff; border-right:2px solid #cbd5e1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  table.sc thead .sticky-n { background:#0f3322; }
  table.sc tr.parrow .sticky-n, table.sc tr.sirow .sticky-n { background:#ddeee3; }
  .sc-mark { display:inline-flex; align-items:center; justify-content:center; width:26px; height:26px; font-weight:700; position:relative; }
  .sc-mark.birdie { border-radius:50%; border:2px solid #dc2626; color:#b91c1c; }
  .sc-mark.eagle  { border-radius:50%; border:2px solid #dc2626; box-shadow:0 0 0 2px #fff, 0 0 0 4px #dc2626; color:#b91c1c; }
  .sc-mark.bogey  { border:2px solid #475569; color:#334155; }
  .sc-mark.double { border:2px solid #475569; box-shadow:0 0 0 2px #fff, 0 0 0 4px #475569; color:#334155; }
  .sc-mark.stk::after { content:''; position:absolute; top:-3px; right:-5px; width:6px; height:6px; border-radius:50%; background:#c9a227; }
  .sc-wrap { position:relative; display:inline-block; }
  .sc-wrap.stk::after { content:''; position:absolute; top:-2px; right:-3px; width:6px; height:6px; border-radius:50%; background:#c9a227; pointer-events:none; }
  input.sc-in { width:38px; height:32px; text-align:center; font-weight:700; font-size:16px; background:transparent; border:2px solid transparent; border-radius:6px; padding:0; color:#0f172a; -moz-appearance:textfield; outline:none; }
  input.sc-in.birdie { border-radius:50%; border-color:#dc2626; color:#b91c1c; }
  input.sc-in.eagle { border-radius:50%; border-color:#dc2626; box-shadow:0 0 0 2px #fff, 0 0 0 4px #dc2626; color:#b91c1c; }
  input.sc-in.bogey { border-color:#475569; color:#334155; }
  input.sc-in.double { border-color:#475569; box-shadow:0 0 0 2px #fff, 0 0 0 4px #475569; color:#334155; }
  input.pt-in { width:38px; height:26px; margin-top:4px; text-align:center; font-weight:700; font-size:14px; background:#eff6ff; border:1px solid #bfdbfe; border-radius:6px; padding:0; color:#1d4ed8; -moz-appearance:textfield; outline:none; }
  input.sc-in::-webkit-outer-spin-button, input.sc-in::-webkit-inner-spin-button, input.pt-in::-webkit-outer-spin-button, input.pt-in::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }
  input.sc-in:focus, input.pt-in:focus { border-color:#276f49; box-shadow:0 0 0 2px #bcdcc8; border-radius:6px; }
  .pulse-dot { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:.35 } }
  .toast { animation: tin .2s ease-out; }
  @keyframes tin { from { opacity:0; transform: translateY(8px) } to { opacity:1; transform:none } }
</style>
</head>

function cleanName(s, max) { return String(s == null ? '' : s).replace(/[\u0000-\u001f<>]/g, '').trim().slice(0, max); }
function validPlayer(m) {
  if (!m || typeof m !== 'object') return null;
  if (typeof m.id !== 'string' || !/^[a-z0-9]{6,16}$/.test(m.id)) return null;
  if (!Array.isArray(m.s) || m.s.length !== 18 || !Array.isArray(m.st) || m.st.length !== 18) return null;
  const s = m.s.map(v => (Number.isInteger(v) && v >= 1 && v <= 15) ? v : null);
  const st = m.st.map(v => (typeof v === 'number' && isFinite(v) && v >= 0) ? v : 0);
  const ptRaw = Array.isArray(m.pt) && m.pt.length === 18 ? m.pt : Array(18).fill(null);
  const pstRaw = Array.isArray(m.pst) && m.pst.length === 18 ? m.pst : Array(18).fill(0);
  const pt = ptRaw.map(v => (Number.isInteger(v) && v >= 0 && v <= 99) ? v : null);
  const pst = pstRaw.map(v => (typeof v === 'number' && isFinite(v) && v >= 0) ? v : 0);

  const mt = (typeof m.mt === 'number' && isFinite(m.mt)) ? m.mt : 0;
  const c = (typeof m.c === 'number' && isFinite(m.c)) ? m.c : mt;

}
function validCfg(m) {
  if (!m || typeof m !== 'object') return null;
  if (!Array.isArray(m.par) || m.par.length !== 18 || !Array.isArray(m.si) || m.si.length !== 18) return null;
  const par = m.par.map(v => Number.isInteger(v) ? clamp(v, 3, 6) : 4);
  const si = m.si.map((v, i) => Number.isInteger(v) ? clamp(v, 1, 18) : DEFAULT_SI[i]);
  const ts = (typeof m.ts === 'number' && isFinite(m.ts)) ? m.ts : 0;
  const idOk = x => typeof x === 'string' && /^[a-z0-9]{6,16}$/.test(x);
  const order = [...new Set((Array.isArray(m.order) ? m.order : []).filter(idOk))].slice(0, 8);
  const gs = Number.isInteger(m.gs) ? clamp(m.gs, 0, 8) : 0;
  const tmIn = m.tm && typeof m.tm === 'object' ? m.tm : {};
  const k = Number.isInteger(tmIn.k) ? clamp(tmIn.k, 2, 4) : 2;
  const seen = new Set();
  const a = (Array.isArray(tmIn.a) ? tmIn.a : []).filter(x => Array.isArray(x) && idOk(x[0]) && Number.isInteger(x[1]) && x[1] >= 0 && x[1] < k && !seen.has(x[0]) && seen.add(x[0])).slice(0, 8).map(x => [x[0], x[1]]);

function mergePlayer(inc) {
  const cur = S.players[inc.id];
  S.clock = Math.max(S.clock, inc.mt, ...inc.st, ...inc.pst);
  if (!cur) { S.players[inc.id] = inc; return true; }
  let changed = false;
  if (inc.mt > cur.mt) { cur.n = inc.n; cur.h = inc.h; cur.del = inc.del; cur.mt = inc.mt; changed = true; }
  for (let i = 0; i < 18; i++) {
    if (inc.st[i] > cur.st[i]) { cur.s[i] = inc.s[i]; cur.st[i] = inc.st[i]; changed = true; }
    if (inc.pst[i] > cur.pst[i]) { cur.pt[i] = inc.pt[i]; cur.pst[i] = inc.pst[i]; changed = true; }
  }
  return changed;
}

/* =====================================================================
   PERSISTENCE (this device only – lets you reopen the page and carry on)
   ===================================================================== */
function persistSoon() { clearTimeout(S.saveTimer); S.saveTimer = setTimeout(persistNow, 250); }
function persistNow() {
  if (!S.room) return;
  store.set('gg:room:' + S.room, { cfg: S.cfg, players: S.players, mine: S.mine, clock: S.clock, dirty: [...S.dirty], needCfg: S.needCfg });
}
function loadCache(code) {
  const c = store.get('gg:room:' + code);
  if (!c) return;
  const cfg = validCfg(c.cfg); if (cfg) mergeCfg(cfg);
  Object.values(c.players || {}).forEach(raw => { const p = validPlayer(raw); if (p) mergePlayer(p); });
  S.mine = (Array.isArray(c.mine) ? c.mine : []).filter(id => S.players[id]);
  (Array.isArray(c.dirty) ? c.dirty : []).forEach(id => { if (S.players[id]) S.dirty.add(id); });

/* =====================================================================
   NETWORK
   ===================================================================== */
function connect() {
  disconnect();
  if (!S.room) return;
  S.conn = 'connecting'; updateStatus();
  let es;
  try { es = new EventSource(topic() + '/sse?since=all'); }
  catch (e) { S.conn = 'offline'; updateStatus(); setTimeout(connect, 5000); return; }
  S.es = es;
  let opened = false;
  es.addEventListener('open', () => {
    opened = true; S.conn = 'live'; updateStatus();
    // after the history replay has landed, make sure our own data & course are on the server
    if (!S.republished) {
      S.republished = true;
      setTimeout(() => { enforceCap(); S.mine.forEach(id => S.dirty.add(id)); if (S.cfg.ts > 0) S.needCfg = true; flush(); }, 3000);
    }
    if (S.dirty.size || S.needCfg) flush();
  });
  es.addEventListener('message', e => {
    try {
      const m = JSON.parse(e.data);
      if (m && typeof m.message === 'string' && handleRaw(m.message)) { persistSoon(); renderSoon(); }
    } catch (err) {}
  });
  es.onerror = () => {
    if (es !== S.es) return;
    if (es.readyState === 2) { S.conn = 'offline'; updateStatus(); setTimeout(() => { if (es === S.es) connect(); }, 4000); }
    else { S.conn = opened ? 'connecting' : 'offline'; updateStatus(); }
  };
}
function disconnect() { if (S.es) { try { S.es.close(); } catch (e) {} S.es = null; } }
async function send(obj) {
  try {
    const r = await fetch(topic(), { method: 'POST', body: JSON.stringify(obj) });
    return r.ok;
  } catch (e) { return false; }
}
function schedulePublish(delay) { clearTimeout(S.pubTimer); S.pubTimer = setTimeout(flush, delay == null ? 600 : delay); }
let flushing = false;
async function flush() {
  if (flushing || !S.room) return;
  flushing = true;
  try {
    let failed = false;
    if (S.needCfg && S.cfg.ts > 0) {
      S.needCfg = false;
      if (await send(cfgMsg())) S.lastCfgPub = Date.now(); else { S.needCfg = true; failed = true; }
    }
    for (const id of [...S.dirty]) {
      if (failed) break;
      const p = S.players[id];
      S.dirty.delete(id);
      if (!p) continue;
      if (!(await send(playerMsg(p)))) { S.dirty.add(id); failed = true; }
    }
    // keep the course alive on the relay during long events (relay history is ~12 h)
    if (!failed && S.cfg.ts > 0 && Date.now() - S.lastCfgPub > 3 * 3600 * 1000) {
      if (await send(cfgMsg())) S.lastCfgPub = Date.now();
    }
    if (failed) { S.pubFail = Math.min(S.pubFail + 1, 6); schedulePublish(Math.min(2000 * Math.pow(2, S.pubFail), 30000)); }
    else S.pubFail = 0;
    persistSoon();
  } finally { flushing = false; updateStatus(); }
}

/* =====================================================================
   ACTIONS
   ===================================================================== */
function newPlayer(name, hcp) {
  const t = tick();
  return { id: randStr(10), n: cleanName(name, 28) || 'Player', h: clamp(parseInt(hcp, 10) || 0, 0, 54), mt: t, c: t, del: 0, s: Array(18).fill(null), st: Array(18).fill(0), pt: Array(18).fill(null), pst: Array(18).fill(0) };
}
const MAX_PLAYERS = 8;
function addMine(name, hcp) {
  if (visiblePlayers().length >= MAX_PLAYERS) { toast('Tournament is full (8 players/teams max).', 'warn', 4000); return null; }
  const p = newPlayer(name, hcp);
  S.players[p.id] = p; S.mine.push(p.id); S.dirty.add(p.id);
  return p;
}
function firstOpenHole() {
  const me = S.players[S.mine[0]];
  if (!me) return 0;
  const i = me.s.findIndex(v => v == null);
  return i < 0 ? 17 : i;
}
function enterRoom(code, addPlayerOpts) {
  disconnect();

  S.republished = false; S.pubFail = 0; S.lastCfgPub = 0; S.clock = 0;
  loadCache(code);
  if (addPlayerOpts && addPlayerOpts.name) addMine(addPlayerOpts.name, addPlayerOpts.hcp);
  if (addPlayerOpts && addPlayerOpts.extras) addPlayerOpts.extras.forEach(x => addMine(x.name, x.hcp));
  if (addPlayerOpts && addPlayerOpts.create) { S.cfg = addPlayerOpts.cfg; S.cfg.ts = tick(); S.needCfg = true; }
  store.set('gg:last', { room: code });
  try { history.replaceState(null, '', '#room=' + code); } catch (e) {}
  S.view = 'room'; S.tab = 'score'; S.hole = firstOpenHole(); S.scrollChip = true;
  persistNow();
  connect();
  flush();
  render();

  if (!addPlayerOpts || !addPlayerOpts.create) {
    setTimeout(() => {
      if (S.room === code && S.cfg.ts === 0 && S.conn === 'live')

}
function leaveRoom() {

  render();
}
function bump(pid, d) {
  const p = S.players[pid]; if (!p) return;
  const i = S.hole, par = S.cfg.par[i];
  p.s[i] = p.s[i] == null ? par : clamp(p.s[i] + d, 1, 15);
  p.st[i] = tick();
  S.dirty.add(pid); persistNow(); schedulePublish(); render(); updateStatus();
}
function clearScore(pid) {
  const p = S.players[pid]; if (!p || p.s[S.hole] == null) return;
  p.s[S.hole] = null; p.st[S.hole] = tick();
  S.dirty.add(pid); persistNow(); schedulePublish(); render(); updateStatus();
}
function enforceCap() {
  const vis = visiblePlayers().sort((a, b) => a.c - b.c || a.id.localeCompare(b.id));
  const allowed = new Set(vis.slice(0, MAX_PLAYERS).map(p => p.id));
  let removed = 0;
  S.mine.slice().forEach(id => {
    if (!allowed.has(id)) { const p = S.players[id]; p.del = 1; touchPlayer(p); S.mine = S.mine.filter(x => x !== id); removed++; }
  });

}
function bumpPts(pid, d) {

function setCell(pid, i, kind, raw, el) {

  const h = S.hole, par = S.cfg.par[h], si = S.cfg.si[h];
  const mine = ps.filter(p => S.mine.includes(p.id));
  const chips = Array.from({ length: 18 }, (_, i) => {
    const done = mine.length > 0 && mine.every(p => p.s[i] != null);
    const act = i === h;
    return `<button data-act="hole" data-i="${i}" ${act ? 'data-active="1"' : ''} class="shrink-0 h-10 w-10 rounded-full text-sm font-bold border ${act ? 'bg-forest-700 text-white border-forest-700 shadow' : done ? 'bg-forest-100 text-forest-800 border-forest-300' : 'bg-white text-slate-600 border-slate-300'}">${i + 1}</button>`;
  }).join('');
  const entries = ps.length ? ps.map(p => {
    const v = p.s[h], st = stats(p), you = S.mine.includes(p.id), stroke = strokesOn(p.h, h);
    return `<div class="bg-white rounded-t-2xl shadow p-3 flex items-center gap-2 border ${you ? 'border-forest-300' : 'border-slate-100'}">
      <div class="flex-1 min-w-0">
        <div class="font-bold truncate">${esc(p.n)}${you ? ' <span class="ml-1 align-middle text-[10px] font-bold uppercase bg-forest-100 text-forest-800 rounded px-1.5 py-0.5">You</span>' : ''}</div>
        <div class="text-xs text-slate-500 mt-0.5">
          ${p.h ? 'HCP ' + p.h + ' · ' : ''}Thru ${st.thru} · <span class="font-bold ${parColor(st.toPar)}">${st.thru ? fmtPar(st.toPar) : '–'}</span>
          ${stroke ? ` · <span class="text-gold font-bold">● ${stroke > 1 ? stroke + ' strokes' : 'stroke'}</span>` : ''}
          ${v != null ? ` · <button data-act="clr" data-id="${p.id}" class="underline text-slate-400">clear</button>` : ''}
        </div>
      </div>
      <button data-act="dec" data-id="${p.id}" aria-label="Minus one" class="h-14 w-14 shrink-0 rounded-xl bg-forest-100 text-forest-800 text-3xl font-bold">−</button>
      <div class="w-14 shrink-0 text-center">
        <div class="text-4xl font-extrabold tabular-nums ${v == null ? 'text-slate-300' : 'text-forest-900'}">${v == null ? '–' : v}</div>
        <div class="text-[10px] font-bold uppercase tracking-wide text-slate-500 h-3">${scoreLabel(v, par)}</div>
      </div>
      <button data-act="inc" data-id="${p.id}" aria-label="Plus one" class="h-14 w-14 shrink-0 rounded-xl bg-forest-700 text-white text-3xl font-bold">+</button>
    </div>
    <div class="-mt-1 mb-2 mx-2 flex items-center justify-end gap-2 bg-blue-50 border border-blue-100 rounded-b-xl px-3 py-1.5">
      <span class="text-[11px] font-bold uppercase tracking-wide text-blue-700 mr-auto">Points · ${esc(p.n)} <span class="font-normal normal-case text-blue-500">(total ${st.pN ? st.pTot : 0})</span></span>
      <button data-act="pdec" data-id="${p.id}" aria-label="Minus one point" class="h-9 w-9 rounded-lg bg-white border border-blue-200 text-blue-700 text-xl font-bold">−</button>
      <span class="w-8 text-center text-xl font-extrabold tabular-nums ${p.pt[h] == null ? 'text-blue-200' : 'text-blue-700'}">${p.pt[h] == null ? '–' : p.pt[h]}</span>
      <button data-act="pinc" data-id="${p.id}" aria-label="Plus one point" class="h-9 w-9 rounded-lg bg-blue-600 text-white text-xl font-bold">+</button>
    </div>`;
  }).join('') : `<div class="bg-white rounded-2xl p-6 text-center text-slate-500 mb-2">No players yet. Add one in <button data-act="tab" data-t="setup" class="font-bold text-forest-700 underline">Setup</button>.</div>`;

  return `
  <section class="bg-white rounded-2xl shadow p-3 mb-3 border border-slate-100">
    <div class="flex items-center justify-between">
      <button data-act="prev" aria-label="Previous hole" class="h-12 w-12 rounded-full bg-forest-100 text-forest-800 text-3xl font-bold leading-none ${h === 0 ? 'opacity-30' : ''}">‹</button>
      <div class="text-center">
        <div class="text-[11px] uppercase tracking-[.25em] text-slate-500 font-bold">Hole</div>
        <div class="text-5xl font-extrabold text-forest-900 leading-none">${h + 1}</div>
        <div class="text-sm text-slate-600 mt-1 font-semibold">Par ${par} · ${teeById(S.tee).y[h]} yds · SI ${si}</div>
      </div>
      <button data-act="next" aria-label="Next hole" class="h-12 w-12 rounded-full bg-forest-700 text-white text-3xl font-bold leading-none ${h === 17 ? 'opacity-30' : ''}">›</button>
    </div>
    <div id="chips" class="mt-3 flex gap-2 overflow-x-auto no-sb pb-1">${chips}</div>
  </section>
  ${entries}
  <section class="mt-4 bg-white rounded-2xl shadow border border-slate-100 overflow-hidden">
    <div class="flex items-center justify-between px-4 py-3">
      <div class="flex items-center gap-2"><h2 class="font-extrabold text-forest-900">Full Scorecard</h2>
        <button data-act="reorder" class="rounded-full px-3 py-1 text-xs font-bold border-2 ${S.reorder ? 'bg-forest-700 text-white border-forest-700' : 'bg-white text-forest-800 border-forest-300'}">${S.reorder ? 'Done' : '↕ Reorder'}</button></div>
      <span class="text-[11px] text-slate-500 text-right">Tap any box to edit · swipe →<br><span class="font-bold text-slate-700">Top = score</span> · <span class="font-bold text-blue-700">blue = points</span> · <span class="text-gold font-bold">●</span> stroke</span>
    </div>
    <div class="px-3 pb-2 flex items-center gap-2 overflow-x-auto no-sb">
      <span class="text-[11px] font-bold uppercase tracking-wide text-slate-500 shrink-0">Tees</span>
      ${TEES.map(x => `<button data-act="tee" data-id="${x.id}" class="shrink-0 rounded-full px-3 py-1 text-xs font-bold border-2 ${S.tee === x.id ? 'text-white' : 'bg-white text-slate-700'}" style="border-color:${x.color};${S.tee === x.id ? 'background:' + x.color : ''}">${x.name}</button>`).join('')}
      <span class="text-[11px] text-slate-500 shrink-0">${esc(teeById(S.tee).info)}</span>
    </div>
    <div id="tw" class="tbl-wrap overflow-x-auto">${scoreTable(orderedPlayers())}</div>
  </section>`;
}
function scoreTable(ps) {
  const par = S.cfg.par, si = S.cfg.si;
  const sum = (arr, a, b) => arr.slice(a, b).reduce((x, y) => x + y, 0);
  const holeTh = i => `<th data-act="cell" data-i="${i}" class="cursor-pointer ${i === S.hole ? 'bg-forest-600' : ''}">${i + 1}</th>`;
  const tot = (cls, t) => `<th class="${cls}">${t}</th>`;
  const head = `<tr class="bg-forest-900 text-white">
      <th class="sticky-n">Player</th>
      ${[0,1,2,3,4,5,6,7,8].map(holeTh).join('')}<th class="bg-forest-800">OUT</th>
      ${[9,10,11,12,13,14,15,16,17].map(holeTh).join('')}<th class="bg-forest-800">IN</th>
      <th class="bg-gold text-forest-900">TOT</th><th class="bg-forest-800">+/−</th><th class="bg-forest-800">NET</th></tr>`;
  const parRow = `<tr class="parrow bg-forest-100 text-forest-900 font-bold">
      <td class="sticky-n">Par</td>
      ${par.slice(0, 9).map(x => `<td>${x}</td>`).join('')}<td>${sum(par, 0, 9)}</td>
      ${par.slice(9).map(x => `<td>${x}</td>`).join('')}<td>${sum(par, 9, 18)}</td>
      <td>${sum(par, 0, 18)}</td><td></td><td></td></tr>`;
  const tee = teeById(S.tee), ys = tee.y;
  const yardsRow = `<tr class="bg-white text-slate-600 text-xs">
      <td class="sticky-n font-bold" style="background:#fff;color:${tee.color === '#9ca3af' ? '#475569' : tee.color}">${tee.name} yds</td>
      ${ys.slice(0, 9).map(x => `<td>${x}</td>`).join('')}<td class="font-bold">${sum(ys, 0, 9)}</td>
      ${ys.slice(9).map(x => `<td>${x}</td>`).join('')}<td class="font-bold">${sum(ys, 9, 18)}</td>
      <td class="font-bold">${sum(ys, 0, 18)}</td><td></td><td></td></tr>`;
  const siRow = `<tr class="sirow bg-forest-50 text-slate-500 text-xs">
      <td class="sticky-n">Stroke idx</td>
      ${si.slice(0, 9).map(x => `<td>${x}</td>`).join('')}<td></td>
      ${si.slice(9).map(x => `<td>${x}</td>`).join('')}<td></td><td></td><td></td><td></td></tr>`;
  const cell = (p, i) => {
    const v = p.s[i], q = p.pt[i];
    return `<td class="${i === S.hole ? 'bg-forest-50' : ''}"><div class="sc-wrap ${strokesOn(p.h, i) ? 'stk' : ''}"><input class="${scClass(v, par[i])}" data-f="sc" data-id="${p.id}" data-i="${i}" type="number" inputmode="numeric" min="1" max="15" value="${v == null ? '' : v}" aria-label="${esc(p.n)} score hole ${i + 1}"></div><br><input class="pt-in" data-f="pt" data-id="${p.id}" data-i="${i}" type="number" inputmode="numeric" min="0" max="99" value="${q == null ? '' : q}" aria-label="${esc(p.n)} points hole ${i + 1}"></td>`;
  };
  const sub = (k, v) => `<div data-t="${k}" class="text-blue-700 text-xs font-bold border-t border-slate-200 mt-1 pt-1">${v}</div>`;
  const gs = S.cfg.gs || 0;
  const rows = ps.map((p, idx) => {
    const st = stats(p), you = S.mine.includes(p.id);
    const band = gs > 0 && idx % gs === 0 ? `<tr class="grp"><td class="sticky-n" style="background:#174631;color:#fff;font-size:11px;font-weight:800;letter-spacing:.08em;padding-top:3px;padding-bottom:3px">GROUP ${idx / gs + 1}</td><td colspan="23" style="background:#174631;padding:0"></td></tr>` : '';
    const nm = `<td class="sticky-n font-bold" title="${esc(p.n)}">${esc(p.n)}<div class="text-[10px] font-normal text-slate-500">${p.h ? 'HCP ' + p.h : 'Score'} <span class="text-blue-600 font-bold">· Pts</span></div>${S.reorder ? `<div class="flex gap-1 mt-1"><button data-act="mv" data-id="${p.id}" data-d="-1" class="h-6 w-9 rounded bg-forest-100 text-forest-800 text-xs font-bold ${idx === 0 ? 'opacity-30' : ''}" aria-label="Move up">▲</button><button data-act="mv" data-id="${p.id}" data-d="1" class="h-6 w-9 rounded bg-forest-100 text-forest-800 text-xs font-bold ${idx === ps.length - 1 ? 'opacity-30' : ''}" aria-label="Move down">▼</button></div>` : ''}</td>`;
    return band + `<tr data-pid="${p.id}" class="${you ? 'bg-forest-50/40' : ''}">${nm}
      ${[0,1,2,3,4,5,6,7,8].map(i => cell(p, i)).join('')}<td class="bg-slate-50 font-bold"><div data-t="out">${st.outN ? st.out : '–'}</div>${sub('pout', st.pN ? st.pOut : '–')}</td>
      ${[9,10,11,12,13,14,15,16,17].map(i => cell(p, i)).join('')}<td class="bg-slate-50 font-bold"><div data-t="in">${st.inN ? st.inn : '–'}</div>${sub('pin', st.pN ? st.pIn : '–')}</td>
      <td class="bg-yellow-50 font-extrabold"><div data-t="tot">${st.thru ? st.g : '–'}</div>${sub('ptot', st.pN ? st.pTot : '–')}</td>
      <td data-t="topar" class="font-extrabold ${parColor(st.toPar)}">${st.thru ? fmtPar(st.toPar) : '–'}</td>
      <td data-t="net" class="font-bold text-slate-700">${st.thru ? (p.h ? st.net + ' <span class="text-xs ' + parColor(st.netToPar) + '">(' + fmtPar(st.netToPar) + ')</span>' : st.g) : '–'}</td></tr>`;
  }).join('');
  return `<table class="sc"><thead>${head}</thead><tbody>${parRow}${yardsRow}${siRow}${rows}</tbody></table>`;
}

/* ---------- leaderboard tab ---------- */
function lbTab(ps) {
  const net = S.lb === 'net', pts = S.lb === 'pts';
  const rows = ps.map(p => { const st = stats(p); return { p, st, key: pts ? -st.pTot : (net ? st.netToPar : st.toPar), total: net ? st.net : st.g }; });
  const isPlayed = r => pts ? r.st.pN > 0 : r.st.thru > 0;
  const played = rows.filter(isPlayed).sort((a, b) => a.key - b.key || b.st.thru - a.st.thru || a.p.n.localeCompare(b.p.n));
  const idle = rows.filter(r => !isPlayed(r)).sort((a, b) => a.p.n.localeCompare(b.p.n));
  played.forEach((r, i) => {
    const first = played.findIndex(x => x.key === r.key);
    const count = played.filter(x => x.key === r.key).length;
    r.pos = first + 1; r.tie = count > 1;
  });
  const medal = pos => pos === 1 ? 'bg-gold text-forest-900' : pos === 2 ? 'bg-slate-300 text-slate-800' : pos === 3 ? 'bg-amber-700 text-white' : 'bg-forest-100 text-forest-800';
  const line = r => {
    const you = S.mine.includes(r.p.id);
    const posTxt = r.pos ? (r.tie ? 'T' : '') + r.pos : '–';
    return `<div class="flex items-center gap-3 px-4 py-3 border-b border-slate-100 ${you ? 'bg-forest-50' : ''}">
      <div class="h-9 w-9 shrink-0 rounded-full flex items-center justify-center text-sm font-extrabold ${r.pos ? medal(r.pos) : 'bg-slate-100 text-slate-400'}">${posTxt}</div>
      <div class="flex-1 min-w-0">
        <div class="font-bold truncate">${esc(r.p.n)}${you ? ' <span class="ml-1 align-middle text-[10px] font-bold uppercase bg-forest-100 text-forest-800 rounded px-1.5 py-0.5">You</span>' : ''}</div>
        <div class="text-xs text-slate-500">${r.st.thru === 18 ? 'Finished' : r.st.thru ? 'Thru ' + r.st.thru : 'Not started'}${r.p.h ? ' · HCP ' + r.p.h : ''}</div>
      </div>
      <div class="text-right">
        ${pts ? `<div class="text-2xl font-extrabold tabular-nums leading-none ${r.st.pN ? 'text-blue-700' : 'text-slate-300'}">${r.st.pN ? r.st.pTot : '–'}</div>
        <div class="text-xs text-slate-500 mt-1">${r.st.pN ? 'pts · F ' + r.st.pOut + ' / B ' + r.st.pIn : ''}</div>` : `<div class="text-2xl font-extrabold tabular-nums leading-none ${r.st.thru ? parColor(r.key) : 'text-slate-300'}">${r.st.thru ? fmtPar(r.key) : '–'}</div>
        <div class="text-xs text-slate-500 mt-1">${r.st.thru ? (net ? 'Net ' : 'Gross ') + r.total : ''}${r.st.pN ? ' · ' + r.st.pTot + ' pts' : ''}</div>`}
      </div>
    </div>`;
  };
  const tgl = (id, label) => `<button data-act="lbmode" data-m="${id}" class="flex-1 py-2 text-sm font-bold rounded-lg ${S.lb === id ? 'bg-forest-700 text-white shadow' : 'text-forest-800'}">${label}</button>`;
  return `
  <section class="bg-white rounded-2xl shadow border border-slate-100 overflow-hidden">
    <div class="bg-forest-900 text-white px-4 py-3 flex items-center justify-between">
      <h2 class="font-extrabold text-lg">Live Leaderboard</h2>
      <span class="text-[11px] font-bold px-2 py-1 rounded ${S.conn === 'live' ? 'bg-red-500 pulse-dot' : 'bg-slate-500'}">${S.conn === 'live' ? 'LIVE' : 'OFFLINE'}</span>
    </div>
    <div class="p-3 bg-forest-50"><div class="flex gap-1 bg-white rounded-xl p-1 border border-forest-100">${tgl('gross', 'Gross')}${tgl('net', 'Net')}${tgl('pts', 'Points')}</div></div>
    ${played.length || idle.length ? played.map(line).join('') + idle.map(line).join('') : '<div class="p-6 text-center text-slate-500">No players yet.</div>'}
    <div class="px-4 py-3 text-[11px] text-slate-500">${pts ? 'Ranked by total points (most first). Front 9 / Back 9 totals shown as F / B.' : 'Ranked by score relative to par over holes played.'} ${net ? 'Net uses each player’s handicap and the course stroke index.' : ''}</div>
  </section>`;
}

/* ---------- teams tab: wheel draft + winner by points ---------- */
const TEAM_COLORS = ['#1d4e9e', '#c9a227', '#be123c', '#276f49'];
const WHEEL_COLORS = ['#0f3322', '#276f49', '#c9a227', '#388a5c', '#1d4e9e', '#b45309', '#7c3aed', '#be123c'];
function randInt(n) { const b = new Uint32Array(1); (window.crypto || window.msCrypto).getRandomValues(b); return b[0] % n; }
function teamStandings() {
  const tm = S.cfg.tm;
  const teams = Array.from({ length: tm.k }, (_, i) => ({ i, members: [], pts: 0, pOut: 0, pIn: 0 }));
  tm.a.forEach(([pid, ti]) => {
    const p = S.players[pid]; if (!p || p.del || !teams[ti]) return;
    const st = stats(p);
    teams[ti].members.push({ p, st }); teams[ti].pts += st.pTot; teams[ti].pOut += st.pOut; teams[ti].pIn += st.pIn;
  });
  return teams;
}
function remainingPlayers() {
  const done = new Set(S.cfg.tm.a.map(x => x[0]));
  return orderedPlayers().filter(p => !done.has(p.id));
}
function teamsTab() {
  const tm = S.cfg.tm, rem = remainingPlayers(), teams = teamStandings();
  const complete = rem.length === 0 && tm.a.length > 0;
  const ranked = teams.filter(x => x.members.length).sort((a, b) => b.pts - a.pts || a.i - b.i);
  const top = ranked.length ? ranked[0].pts : 0;
  const tied = complete ? ranked.filter(x => x.pts === top) : [];
  const needTie = complete && tied.length > 1 && tm.tb < 0;
  const anyPts = ranked.some(x => x.pts > 0);
  const winner = complete && anyPts ? (tied.length > 1 ? (tm.tb >= 0 ? teams[tm.tb] : null) : ranked[0]) : null;
  // wheel contents
  if (needTie) { S.wheelMode = 'tie'; S.wheelItems = tied.map(x => ({ label: 'Team ' + (x.i + 1), team: x.i, color: TEAM_COLORS[x.i] })); }
  else { S.wheelMode = 'draft'; S.wheelItems = rem.map((p, i) => ({ label: p.n, pid: p.id, color: WHEEL_COLORS[i % WHEEL_COLORS.length] })); }
  const nextTeam = tm.a.length % tm.k;
  const kBtn = k => `<button data-act="teamk" data-k="${k}" class="flex-1 py-2 text-sm font-bold rounded-lg ${tm.k === k ? 'bg-forest-700 text-white shadow' : 'text-forest-800'} ${tm.a.length ? 'opacity-50' : ''}">${k} teams</button>`;
  const standRows = ranked.length ? ranked.map((x, r) => {
    const pos = ranked.findIndex(y => y.pts === x.pts) + 1, isW = winner && winner.i === x.i;
    return `<div class="px-4 py-3 border-b border-slate-100 ${isW ? 'bg-yellow-50' : ''}">
      <div class="flex items-center gap-3">
        <div class="h-9 w-9 shrink-0 rounded-full flex items-center justify-center text-sm font-extrabold text-white" style="background:${TEAM_COLORS[x.i]}">${isW ? '🏆' : pos}</div>
        <div class="flex-1 min-w-0"><div class="font-extrabold">Team ${x.i + 1}${isW ? ' · Winner' : ''}</div><div class="text-xs text-slate-500">F ${x.pOut} / B ${x.pIn}</div></div>
        <div class="text-right"><div class="text-3xl font-extrabold tabular-nums text-blue-700 leading-none">${x.pts}</div><div class="text-[10px] uppercase font-bold text-slate-400">points</div></div>
      </div>
      <div class="mt-2 flex flex-wrap gap-1.5">${x.members.map(m => `<span class="text-xs font-semibold rounded-full px-2.5 py-1 bg-slate-100 text-slate-700">${esc(m.p.n)} <span class="text-blue-700">${m.st.pTot}</span></span>`).join('')}</div>
    </div>`;
  }).join('') : '<div class="p-6 text-center text-slate-500 text-sm">Spin the wheel to start picking teams.</div>';
  return `
  <section class="bg-white rounded-2xl shadow border border-slate-100 overflow-hidden mb-3">
    <div class="bg-forest-900 text-white px-4 py-3"><h2 class="font-extrabold text-lg">Team Draw</h2>
      <p class="text-xs text-forest-200">Spin to pick players one at a time. Picks go to Team 1, Team 2… in rotation. Winner = most total points.</p></div>
    <div class="p-3 bg-forest-50"><div class="flex gap-1 bg-white rounded-xl p-1 border border-forest-100">${kBtn(2)}${kBtn(3)}${kBtn(4)}</div></div>
    <div class="px-4 pt-4 pb-2 text-center">
      ${S.wheelItems.length ? `<div class="text-sm font-bold text-slate-600 mb-2">${needTie ? 'Tied for first! Spin to break the tie' : 'Next pick goes to <span style="color:' + TEAM_COLORS[nextTeam] + '">Team ' + (nextTeam + 1) + '</span>'}</div>` : `<div class="text-sm font-bold text-forest-700 mb-2">${complete ? 'All players picked!' : 'No players to draw yet — add players in Setup.'}</div>`}
      <div class="relative mx-auto" style="width:min(320px,100%)">
        <div class="absolute left-1/2 -top-1 z-10" style="transform:translateX(-50%);width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-top:22px solid #c9a227;filter:drop-shadow(0 1px 1px rgba(0,0,0,.4))"></div>
        <canvas id="wheel" width="640" height="640" style="width:100%;height:auto;aspect-ratio:1/1" aria-label="Name picker wheel"></canvas>
      </div>
      <div class="mt-3 flex gap-2 justify-center">
        <button data-act="spin" class="flex-1 max-w-[220px] rounded-xl bg-gold text-forest-900 font-extrabold py-3 text-lg shadow ${S.wheelItems.length ? '' : 'opacity-40'}">${S.spinning ? 'Spinning…' : (needTie ? 'SPIN TIEBREAK' : 'SPIN')}</button>
        ${!needTie && rem.length > 1 ? '<button data-act="autodraw" class="rounded-xl border-2 border-forest-300 text-forest-800 font-bold px-4 py-3 text-sm">Draw all</button>' : ''}
      </div>
    </div>
  </section>
  ${winner ? `<div class="rounded-2xl p-4 mb-3 text-center shadow border-2" style="background:#fffbea;border-color:#c9a227"><div class="text-3xl">🏆</div><div class="text-xl font-extrabold text-forest-900">Team ${winner.i + 1} wins!</div><div class="text-sm text-slate-600">${winner.pts} points${tied.length > 1 ? ' · decided by wheel tiebreak' : ''}${winner.members.length ? '<br>' + winner.members.map(m => esc(m.p.n)).join(' · ') : ''}</div></div>` : (complete && !anyPts ? '<div class="rounded-2xl p-3 mb-3 bg-amber-50 border border-amber-200 text-sm text-amber-900 text-center">Teams are set. Enter points on the scorecard and the winner appears here.</div>' : '')}
  <section class="bg-white rounded-2xl shadow border border-slate-100 overflow-hidden">
    <div class="px-4 py-3 flex items-center justify-between"><h2 class="font-extrabold text-forest-900">Team Standings (live)</h2>
      ${tm.a.length ? '<button data-act="resetdraw" class="text-xs font-bold text-red-600 underline">Reset draw</button>' : ''}</div>
    ${standRows}
  </section>`;
}
function drawWheel(rot) {
  const cv = $('#wheel'); if (!cv) return;
  const ctx = cv.getContext('2d'), W = cv.width, cx = W / 2, R = W / 2 - 8, items = S.wheelItems || [];
  ctx.clearRect(0, 0, W, W);
  if (!items.length) {
    ctx.beginPath(); ctx.arc(cx, cx, R, 0, 2 * Math.PI); ctx.fillStyle = '#ddeee3'; ctx.fill();
    ctx.lineWidth = 8; ctx.strokeStyle = '#0f3322'; ctx.stroke();
    ctx.fillStyle = '#0f3322'; ctx.font = 'bold 40px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('All picked ✓', cx, cx + 14);
    return;
  }
  const n = items.length, sl = 2 * Math.PI / n;
  items.forEach((it, i) => {
    const a0 = rot + i * sl - Math.PI / 2;
    ctx.beginPath(); ctx.moveTo(cx, cx); ctx.arc(cx, cx, R, a0, a0 + sl); ctx.closePath();
    ctx.fillStyle = it.color; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = '#fff'; ctx.stroke();
    ctx.save(); ctx.translate(cx, cx); ctx.rotate(a0 + sl / 2);
    ctx.textAlign = 'right'; ctx.fillStyle = it.color === '#c9a227' ? '#0f3322' : '#fff';
    ctx.font = 'bold ' + (n > 6 ? 34 : 40) + 'px sans-serif';
    const label = it.label.length > 13 ? it.label.slice(0, 12) + '…' : it.label;
    ctx.fillText(label, R - 24, 13); ctx.restore();
  });
  ctx.beginPath(); ctx.arc(cx, cx, R, 0, 2 * Math.PI); ctx.lineWidth = 10; ctx.strokeStyle = '#0f3322'; ctx.stroke();
  ctx.beginPath(); ctx.arc(cx, cx, 34, 0, 2 * Math.PI); ctx.fillStyle = '#0f3322'; ctx.fill();
  ctx.lineWidth = 5; ctx.strokeStyle = '#c9a227'; ctx.stroke();
}
function spinWheel() {
  const items = S.wheelItems;
  if (S.spinning || !items || !items.length) return;
  const n = items.length, sl = 2 * Math.PI / n, pick = randInt(n), it = items[pick];
  S.wheelRot = S.wheelRot % (2 * Math.PI);
  const start = S.wheelRot, target = -(pick + 0.5) * sl - 2 * Math.PI * (5 + randInt(3));
  S.spinning = true;
  const t0 = performance.now(), dur = 4600;
  const step = now => {
    const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 4);
    S.wheelRot = start + (target - start) * e;
    drawWheel(S.wheelRot);
    if (k < 1) { requestAnimationFrame(step); return; }
    S.spinning = false;
    S.wheelRot = target % (2 * Math.PI);
    if (it.pid) {
      if (!S.cfg.tm.a.some(x => x[0] === it.pid)) {
        const team = S.cfg.tm.a.length % S.cfg.tm.k;
        updCfg(c => { c.tm.a.push([it.pid, team]); c.tm.tb = -1; });
        const p = S.players[it.pid];
        toast((p ? p.n : 'Player') + ' → Team ' + (team + 1), 'ok', 3200);
      }
    } else if (it.team != null) {
      updCfg(c => { c.tm.tb = it.team; });
      toast('Team ' + (it.team + 1) + ' wins the tiebreak!', 'ok', 3500);
    }
    S.wheelRot = 0;
    render();
  };
  render();                       // refresh the button label, then animate
  requestAnimationFrame(t => { S.spinning = true; step(performance.now()); });
}
function autoDraw() {
  const rem = remainingPlayers(); if (!rem.length) return;
  const pool = rem.slice();
  for (let i = pool.length - 1; i > 0; i--) { const j = randInt(i + 1); [pool[i], pool[j]] = [pool[j], pool[i]]; }
  updCfg(c => { pool.forEach(p => c.tm.a.push([p.id, c.tm.a.length % c.tm.k])); c.tm.tb = -1; });
  toast('Teams drawn');
  render();
}

/* ---------- setup tab ---------- */
function setupTab(ps) {
  const inp = 'rounded-lg border border-slate-300 bg-white px-3 py-2 text-base outline-none focus:border-forest-600 focus:ring-2 focus:ring-forest-200';
  const dupSI = new Set(S.cfg.si).size !== 18;
  const isFile = location.protocol === 'file:';
  const ops = orderedPlayers();
  const playerRows = ops.map((p, k) => `
    <div class="flex items-center gap-2 mb-2">
      <div class="flex flex-col gap-0.5 shrink-0"><button data-act="mv" data-id="${p.id}" data-d="-1" class="h-5 w-7 rounded bg-forest-100 text-forest-800 text-[10px] font-bold ${k === 0 ? 'opacity-30' : ''}" aria-label="Move up">▲</button><button data-act="mv" data-id="${p.id}" data-d="1" class="h-5 w-7 rounded bg-forest-100 text-forest-800 text-[10px] font-bold ${k === ops.length - 1 ? 'opacity-30' : ''}" aria-label="Move down">▼</button></div>
      <input data-f="pn" data-id="${p.id}" value="${esc(p.n)}" maxlength="28" class="${inp} flex-1 min-w-0" aria-label="Player name">
      <input data-f="ph" data-id="${p.id}" value="${p.h}" type="number" inputmode="numeric" min="0" max="54" class="${inp} w-16 text-center" aria-label="Handicap" title="Handicap">
      <button data-act="rmp" data-id="${p.id}" class="h-10 w-10 shrink-0 rounded-lg bg-red-50 text-red-600 font-bold" aria-label="Remove player">✕</button>
    </div>`).join('') || '<p class="text-sm text-slate-500 mb-2">No players yet.</p>';
  const parIn = (i) => `<div class="text-center"><div class="text-[10px] font-bold text-slate-500">${i + 1}</div>
      <input data-f="par" data-i="${i}" value="${S.cfg.par[i]}" type="number" inputmode="numeric" min="3" max="6" class="${inp} w-full px-1 py-1.5 text-center font-bold" aria-label="Par hole ${i + 1}">
      <input data-f="si" data-i="${i}" value="${S.cfg.si[i]}" type="number" inputmode="numeric" min="1" max="18" class="${inp} w-full px-1 py-1.5 text-center text-slate-500 mt-1" aria-label="Stroke index hole ${i + 1}"></div>`;
  return `
  <section class="bg-white rounded-2xl shadow border border-slate-100 p-4 mb-3">
    <h2 class="font-extrabold text-forest-900 mb-1">Invite players</h2>
    <p class="text-sm text-slate-600 mb-3">Share this Room ID. Anyone who joins with it sees and edits all scores live.</p>
    <div class="rounded-xl bg-forest-900 text-white text-center py-4 mb-3"><div class="text-[11px] uppercase tracking-[.3em] text-forest-200">Room ID</div><div class="font-mono text-4xl font-extrabold tracking-[.25em] mt-1">${esc(S.room)}</div></div>
    <div class="grid grid-cols-2 gap-2">
      <button data-act="copycode" class="rounded-xl bg-forest-100 text-forest-800 font-bold py-3">Copy code</button>
      <button data-act="share" class="rounded-xl bg-forest-700 text-white font-bold py-3">Share invite</button>
    </div>
    ${isFile ? `<p class="mt-3 text-xs text-amber-800 bg-amber-50 border border-amber-200 rounded-lg p-2">This page is open from a local file, so an invite link can’t be opened by others. Upload this one HTML file to any free web host (Netlify Drop, GitHub Pages…) and have everyone open that address, then enter the Room ID.</p>` : ''}
  </section>

  <section class="bg-white rounded-2xl shadow border border-slate-100 p-4 mb-3">
    <h2 class="font-extrabold text-forest-900 mb-1">Players &amp; teams</h2>
    <p class="text-xs text-slate-500 mb-3">Use ▲▼ to order players the way they're paired (also available on the scorecard via “Reorder”). Name and handicap (right box). Handicap drives Net scores.</p>
    <label class="block text-xs font-bold uppercase tracking-wide text-slate-500 mb-1">Group bands on scorecard</label>
    <select data-f="gs" class="${inp} w-full mb-3" aria-label="Group size">
      ${[[0, 'No groups'], [2, 'Pairs (2 per group)'], [3, 'Threesomes (3 per group)'], [4, 'Foursomes (4 per group)']].map(([v, l]) => `<option value="${v}" ${S.cfg.gs === v ? 'selected' : ''}>${l}</option>`).join('')}
    </select>
    ${playerRows}
    ${ps.length >= MAX_PLAYERS ? '<p class="mt-3 text-xs font-semibold text-amber-700">Tournament is full: 8 players/teams maximum.</p>' : `
    <form data-form="roster" class="mt-4 border-t border-slate-100 pt-3" autocomplete="off">
      <div class="text-xs font-bold uppercase tracking-wide text-slate-500 mb-2">Add players / teams · ${MAX_PLAYERS - ps.length} of ${MAX_PLAYERS} spots open</div>
      ${rosterRows(MAX_PLAYERS - ps.length, 1, inp)}
      <button class="w-full h-11 rounded-lg bg-forest-700 text-white font-bold">Add to scorecard</button>
    </form>`}
  </section>

  <section class="bg-white rounded-2xl shadow border border-slate-100 p-4 mb-3">
    <h2 class="font-extrabold text-forest-900 mb-3">Tournament &amp; course</h2>
    <label class="block text-xs font-bold uppercase tracking-wide text-slate-500 mb-1">Tournament name</label>
    <input data-f="tn" value="${esc(S.cfg.n)}" maxlength="40" class="${inp} w-full mb-3">
    <label class="block text-xs font-bold uppercase tracking-wide text-slate-500 mb-1">Course</label>
    <input data-f="cn" value="${esc(S.cfg.c)}" maxlength="40" class="${inp} w-full mb-4" placeholder="Course name">
    <div class="text-xs font-bold uppercase tracking-wide text-slate-500 mb-1">Par (top) &amp; stroke index (bottom)</div>
    <div class="grid grid-cols-9 gap-1.5 mb-2">${Array.from({ length: 9 }, (_, i) => parIn(i)).join('')}</div>
    <div class="grid grid-cols-9 gap-1.5">${Array.from({ length: 9 }, (_, i) => parIn(i + 9)).join('')}</div>
    ${dupSI ? '<p class="mt-2 text-xs font-semibold text-amber-700">Stroke index values should be 1–18 with no repeats for accurate net scores.</p>' : ''}
    <p class="mt-2 text-xs text-slate-500">Course changes sync to everyone instantly. Yardages (Gold/Black/Blue/White) and stroke index come from the printed card; <b>par is not printed on it, so check the par row above</b> against the real card.</p>
  </section>

  <section class="bg-white rounded-2xl shadow border border-slate-100 p-4">
    <button data-act="leave" class="w-full rounded-xl border-2 border-red-200 text-red-600 font-bold py-3">Leave tournament</button>
    <p class="mt-2 text-xs text-slate-500 text-center">Your scores stay in the tournament. You can rejoin with the Room ID.</p>
  </section>`;
}

/* =====================================================================
   EVENTS (delegated)
   ===================================================================== */
function copyText(t) {
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(t).then(() => true).catch(() => legacyCopy(t));
  return Promise.resolve(legacyCopy(t));
}
function legacyCopy(t) {
  try {
    const ta = document.createElement('textarea'); ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); ta.remove(); return ok;
  } catch (e) { return false; }
}
async function shareInvite() {
  const url = location.protocol === 'file:' ? '' : location.href.split('#')[0] + '#room=' + S.room;
  const text = `Join "${S.cfg.n}" on Good Golf live scoring. Room ID: ${S.room}`;
  if (navigator.share) {
    try { await navigator.share(url ? { title: 'Good Golf', text, url } : { title: 'Good Golf', text }); return; }
    catch (e) { if (e && e.name === 'AbortError') return; }
  }
  const ok = await copyText(url ? text + '\n' + url : text);
  toast(ok ? 'Invite copied' : 'Could not copy – share the Room ID manually');
}
app.addEventListener('click', e => {
  if (e.target.matches && e.target.matches('input')) return;   // editing a box: never re-render on click
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  switch (act) {
    case 'tab': S.tab = el.dataset.t; S.scrollChip = true; render(); window.scrollTo(0, 0); break;
    case 'hole': setHole(+el.dataset.i); break;
    case 'prev': setHole(S.hole - 1); break;
    case 'next': setHole(S.hole + 1); break;
    case 'cell': setHole(+el.dataset.i); window.scrollTo({ top: 0, behavior: 'smooth' }); break;
    case 'inc': bump(id, 1); break;
    case 'dec': bump(id, -1); break;
    case 'mv': moveBy(id, +el.dataset.d); break;
    case 'reorder': S.reorder = !S.reorder; render(); break;
    case 'spin': spinWheel(); break;
    case 'teamk': if (!S.cfg.tm.a.length) { updCfg(c => { c.tm.k = +el.dataset.k; }); render(); } break;
    case 'resetdraw': if (confirm('Clear the team draw for everyone?')) { updCfg(c => { c.tm.a = []; c.tm.tb = -1; }); S.wheelRot = 0; render(); } break;
    case 'autodraw': autoDraw(); break;
    case 'tee': S.tee = id; store.set('gg:tee', id); render(); break;
    case 'pinc': bumpPts(id, 1); break;
    case 'pdec': bumpPts(id, -1); break;
    case 'clr': clearScore(id); break;
    case 'lbmode': S.lb = el.dataset.m; render(); break;
    case 'lmode': S.lmode = el.dataset.m; S.err = ''; render(); break;
    case 'watch': {
      const code = String(S.form.code || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
      if (code.length < 4) { S.err = 'Enter the Room ID first.'; render(); return; }
      S.err = ''; S.form = {}; enterRoom(code, null); break;
    }
    case 'continue': { const l = store.get('gg:last'); if (l && l.room) enterRoom(l.room); break; }
    case 'copycode': copyText(S.room).then(ok => toast(ok ? 'Room ID copied' : 'Could not copy')); break;
    case 'share': shareInvite(); break;
    case 'rmp': {
      const p = S.players[id]; if (!p) break;
      if (!confirm('Remove "' + p.n + '" from the tournament for everyone?')) break;
      p.del = 1; S.mine = S.mine.filter(x => x !== id); touchPlayer(p); render(); break;
    }
    case 'leave': if (confirm('Leave this tournament on this device?')) leaveRoom(); break;
  }
});
app.addEventListener('focusin', e => {
  const t = e.target;
  if (t.dataset && (t.dataset.f === 'sc' || t.dataset.f === 'pt')) {
    const i = +t.dataset.i;
    if (i !== S.hole) { S.hole = i; S.pendingRender = true; }   // refresh the hole header/entry cards after editing
    try { t.select(); } catch (err) {}
  }
});
app.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset && (t.dataset.f === 'sc' || t.dataset.f === 'pt')) { setCell(t.dataset.id, +t.dataset.i, t.dataset.f, t.value.trim(), t.dataset.f === 'sc' ? t : null); return; }
  if (S.view === 'landing' && t.name) S.form[t.name] = t.name === 'code' ? t.value.toUpperCase() : t.value;
});
app.addEventListener('change', e => {
  const t = e.target, f = t.dataset.f; if (!f) return;
  if (f === 'sc' || f === 'pt') {
    const p = S.players[t.dataset.id], i = +t.dataset.i;
    if (p) { const cur = f === 'sc' ? p.s[i] : p.pt[i]; t.value = cur == null ? '' : cur; if (f === 'sc') t.className = scClass(cur, S.cfg.par[i]); }
    return;
  }
  if (f === 'pn' || f === 'ph') {
    const p = S.players[t.dataset.id]; if (!p) return;
    if (f === 'pn') p.n = cleanName(t.value, 28) || p.n; else p.h = clamp(parseInt(t.value, 10) || 0, 0, 54);
    touchPlayer(p);
  } else if (f === 'gs') updCfg(c => { c.gs = clamp(parseInt(t.value, 10) || 0, 0, 8); });
  else if (f === 'tn') updCfg(c => { c.n = cleanName(t.value, 40) || c.n; });
  else if (f === 'cn') updCfg(c => { c.c = cleanName(t.value, 40); });
  else if (f === 'par') { const i = +t.dataset.i; updCfg(c => { c.par[i] = clamp(parseInt(t.value, 10) || 4, 3, 6); }); }
  else if (f === 'si') { const i = +t.dataset.i; updCfg(c => { c.si[i] = clamp(parseInt(t.value, 10) || DEFAULT_SI[i], 1, 18); }); }
  S.pendingRender = true;
  setTimeout(() => { if (!(document.activeElement && document.activeElement.matches && document.activeElement.matches('input'))) render(); }, 60);
  updateStatus();
});
app.addEventListener('submit', e => {
  const form = e.target.closest('form[data-form]'); if (!form) return;
  e.preventDefault();
  const fd = new FormData(form);
  const kind = form.dataset.form;
  const name = cleanName(fd.get('pname'), 28), hcp = fd.get('hcp');
  if (kind === 'roster') {
    const list = readRoster(fd, 1, 8); let added = 0;
    list.forEach(x => { if (addMine(x.name, x.hcp)) added++; });
    if (added) { persistNow(); schedulePublish(200); render(); toast(added + (added === 1 ? ' player added' : ' players added')); }
    return;
  }
  if (!name) { S.err = 'Please enter your name or group name.'; render(); return; }
  if (kind === 'create') {
    const code = randStr(6, CODE_ALPHABET);
    const cfg = defaultCfg();
    cfg.n = cleanName(fd.get('tname'), 40) || 'Designated Golf Day';
    cfg.c = cleanName(fd.get('cname'), 40);
    const extras = readRoster(fd, 2, 8);
    S.err = ''; S.form = {};
    enterRoom(code, { name, hcp, create: true, cfg, extras });
  } else if (kind === 'join') {
    const code = String(fd.get('code') || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (code.length < 4) { S.err = 'Enter the Room ID you were given.'; render(); return; }
    S.err = ''; S.form = {};
    enterRoom(code, { name, hcp });
  }
});

/* lifecycle: reconnect when the phone wakes / regains signal */
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && S.room && S.conn !== 'live') connect();
  if (document.visibilityState === 'visible' && S.room && (S.dirty.size || S.needCfg)) flush();
});
window.addEventListener('online', () => { if (S.room) { connect(); flush(); } });
window.addEventListener('offline', () => { if (S.room) { S.conn = 'offline'; updateStatus(); } });
window.addEventListener('beforeunload', persistNow);

/* boot – honour #room=CODE links */
(function boot() {
  const m = /room=([A-Za-z0-9]{4,10})/.exec(location.hash || '');
  if (m) {
    const code = m[1].toUpperCase();
    const cached = store.get('gg:room:' + code);
    if (cached && cached.mine && cached.mine.length) { enterRoom(code); return; }
    S.lmode = 'join'; S.form.code = code;
  }
  render();
})();
})();
</script>
